<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Routine">
<meta name="theme-color" content="#1B1E3D">
<title>Daily Routine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #1B1E3D;
    --dusk: #4A3B66;
    --dawn: #FF7A59;
    --amber: #F4A259;
    --day: #FDF8F3;
    --ink: #241F3D;
    --ink-soft: #6b6580;
    --sage: #6B9080;
    --gold: #D4A574;
    --card: #FFFDF9;
    --t: 0;
    --radius: 22px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Work Sans', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(120% 90% at 50% 0%,
        color-mix(in srgb, var(--dawn) calc(var(--t) * 100%), var(--night) calc((1 - var(--t)) * 100%)) 0%,
        color-mix(in srgb, var(--amber) calc(var(--t) * 100%), var(--dusk) calc((1 - var(--t)) * 100%)) 45%,
        color-mix(in srgb, var(--day) calc(var(--t) * 100%), var(--night) calc((1 - var(--t)) * 100%)) 100%);
    transition: background 0.7s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 16px;
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    max-width: 560px;
  }

  .arc-wrap{
    position:relative;
    height: 92px;
    margin-bottom: 8px;
  }

  .arc-wrap svg{ width:100%; height:100%; display:block; overflow:visible; }

  .sun{
    filter: drop-shadow(0 0 10px color-mix(in srgb, var(--amber) 70%, transparent));
    transition: cx 0.6s cubic-bezier(.65,0,.35,1), cy 0.6s cubic-bezier(.65,0,.35,1);
  }

  .steplabel{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--day) calc(var(--t) * 100%), #cfcbe6 calc((1 - var(--t)) * 100%));
    margin-bottom: 22px;
    opacity:0.85;
  }

  .card{
    background: var(--card);
    border-radius: var(--radius);
    padding: 40px 34px 32px;
    box-shadow: 0 24px 60px -20px rgba(20,15,40,0.45), 0 2px 0 rgba(255,255,255,0.6) inset;
    min-height: 340px;
    display:flex;
    flex-direction:column;
  }

  .icon{
    width:44px; height:44px;
    stroke: var(--dawn);
    stroke-width:1.5;
    fill:none;
    margin-bottom:18px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 30px;
    line-height:1.15;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .sub{
    color: var(--ink-soft);
    font-size:15px;
    line-height:1.5;
    margin: 0 0 26px;
    max-width: 42ch;
  }

  .actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:auto;
  }

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    padding: 14px 20px;
    border-radius: 12px;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    color: var(--ink);
  }
  .btn:hover{ transform: translateY(-1px); }
  .btn:focus-visible{ outline: 2px solid var(--dawn); outline-offset:2px; }

  .btn-primary{
    background: linear-gradient(135deg, var(--dawn), var(--amber));
    color: #fff;
    box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--dawn) 70%, transparent);
  }
  .btn-secondary{
    background: color-mix(in srgb, var(--gold) 18%, #fff);
    border: 1px solid color-mix(in srgb, var(--gold) 45%, #fff);
  }
  .btn-arrow{ font-size:16px; opacity:0.7; }

  .nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 12px;
    margin-top: 22px;
    padding: 0 4px;
  }
  .nav button{
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.02em;
    border-radius: 999px;
    padding: 12px 22px;
    border: none;
  }
  .nav button:focus-visible{ outline: 2px solid var(--dawn); outline-offset:2px; }

  .back-main:disabled{ opacity:0; pointer-events:none; }
  .next-main:disabled{
    opacity:0.5;
    cursor:not-allowed;
    filter: none;
  }

  .back-main{
    background: #fff;
    color: var(--ink);
    border: 1.5px solid #ddd6c4 !important;
  }
  .back-main:hover{ background: #f6f1e6; }

  .next-main{
    background: linear-gradient(135deg, var(--dawn), var(--amber));
    color: #fff !important;
    box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--dawn) 70%, transparent);
  }
  .next-main:hover{ filter: brightness(1.05); }

  .edit-row{
    display:flex;
    gap: 16px;
    margin-top: 14px;
  }
  .edit-link-btn{
    background:none;
    border:none;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    padding: 4px 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .edit-link-btn:hover{ color: var(--dawn); }
  .edit-link-btn:focus-visible{ outline: 2px solid var(--dawn); outline-offset:2px; }

  .edit-fields{
    display:flex;
    flex-direction:column;
    gap: 16px;
    margin-bottom: 20px;
  }
  .edit-field{
    display:flex;
    flex-direction:column;
    gap: 5px;
  }
  .edit-field label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .edit-input{
    font-family:'Work Sans', sans-serif;
    font-size: 14.5px;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid #e4dfd2;
    background: #fffefc;
    color: var(--ink);
  }
  .edit-input:focus-visible{ outline: 2px solid var(--dawn); outline-offset:1px; }

  .edit-link-btn.danger{
    color: #c0604a;
  }
  .edit-link-btn.danger:hover{ color: #a3492f; }

  .remove-confirm{
    margin-top: 14px;
    padding: 12px 14px;
    background: color-mix(in srgb, #c0604a 10%, #fff);
    border: 1px solid color-mix(in srgb, #c0604a 30%, #fff);
    border-radius: 10px;
    font-size: 13px;
    color: var(--ink);
  }
  .remove-confirm-actions{
    display:flex;
    gap:16px;
    margin-top: 8px;
  }
  .remove-confirm-actions .edit-link-btn{ font-size: 12px; }

  .skill-note{
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed #e4dfd2;
  }
  .skill-note-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 6px;
  }
  .skill-note-text{
    font-size: 14px;
    line-height:1.5;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .skill-note-empty{
    color: var(--ink-soft);
    font-style: italic;
  }
  .skill-note-input{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size: 14px;
    line-height:1.5;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid #e4dfd2;
    background: #fffefc;
    color: var(--ink);
    resize: vertical;
    margin-bottom: 10px;
  }
  .skill-note-input:focus-visible{ outline: 2px solid var(--dawn); outline-offset:1px; }

  .outer-actions{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:16px;
  }
  .outer-btn{
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.32);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: color-mix(in srgb, var(--day) calc(var(--t) * 100%), #f1eef9 calc((1 - var(--t)) * 100%));
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .outer-btn:hover{ background: rgba(255,255,255,0.24); }
  .outer-btn:focus-visible{ outline: 2px solid #fff; outline-offset: 2px; }
  .outer-btn.danger{
    background: rgba(192,96,74,0.28);
    border-color: rgba(192,96,74,0.55);
    color: #fff;
  }
  .outer-btn.danger:hover{ background: rgba(192,96,74,0.4); }

  .outer-confirm{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    background: rgba(0,0,0,0.22);
    border: 1px solid rgba(255,255,255,0.25);
    padding: 10px 18px;
    border-radius: 999px;
    color: color-mix(in srgb, var(--day) calc(var(--t) * 100%), #fff calc((1 - var(--t)) * 100%));
    font-size: 13px;
  }

  .manage-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom: 8px;
  }
  .manage-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: 10px 12px;
    border: 1px solid #ece7d9;
    border-radius: 10px;
    background: #fffefc;
  }
  .manage-item-title{
    font-size: 14px;
    font-weight: 500;
  }
  .manage-item-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .manage-arrow, .manage-remove{
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid #e4dfd2;
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 13px;
  }
  .manage-arrow:disabled{ opacity: 0.3; cursor: not-allowed; }
  .manage-arrow:hover:not(:disabled){ background: #f6f1e6; }
  .manage-remove{ color: #c0604a; border-color: #ecd3cb; }
  .manage-remove:hover{ background: #fbeeea; }

  .grid-header{
    text-align:center;
    margin-bottom: 16px;
  }
  .grid-header h1{ font-size: 28px; }
  .grid-header .sub{ margin: 0 auto; }

  .win-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }
  .win-card{
    position:relative;
    background:#fffefc;
    border: 1.5px solid #ece7d9;
    border-radius: 16px;
    padding: 16px 10px 12px;
    text-align:center;
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .win-card:hover{ transform: translateY(-2px); border-color:#d8d0b8; }
  .win-card.win-done{
    background: color-mix(in srgb, var(--sage) 12%, #fffefc);
    border-color: color-mix(in srgb, var(--sage) 55%, #ece7d9);
  }
  .win-card .icon{
    width: 26px; height: 26px;
    margin: 0 auto 8px;
    stroke: var(--dawn);
  }
  .win-card.win-done .icon{ stroke: var(--sage); }
  .win-title{
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
  }
  .win-check{
    position:absolute;
    top: 8px; right: 8px;
    width: 21px; height: 21px;
    border-radius: 50%;
    border: 1.5px solid #d8d0b8;
    background: #fff;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    cursor:pointer;
    padding:0;
  }
  .win-check.checked{
    background: var(--sage);
    border-color: var(--sage);
  }
  .win-check:focus-visible{ outline: 2px solid var(--dawn); outline-offset:2px; }

  .next-main.complete-done{
    background: linear-gradient(135deg, var(--sage), #8fae9b);
    box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--sage) 60%, transparent);
  }

  .link-edit-row{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .link-edit-fields{
    flex:1;
    display:flex;
    flex-direction:column;
    gap: 6px;
  }
  .link-remove-btn{
    flex-shrink:0;
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid #ecd3cb;
    background: #fff;
    color: #c0604a;
    cursor:pointer;
    font-size: 13px;
  }
  .link-remove-btn:hover{ background: #fbeeea; }

  .period-tabs{
    display:flex;
    gap: 8px;
    margin: 4px 0 18px;
  }
  .period-tab{
    flex:1;
    padding: 9px 0;
    border-radius: 10px;
    border: 1px solid #e4dfd2;
    background: #fff;
    color: var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .period-tab.active{
    background: linear-gradient(135deg, var(--dawn), var(--amber));
    border-color: transparent;
    color: #fff;
  }
  .progress-list{
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .progress-item-top{
    display:flex;
    justify-content:space-between;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .progress-item-title{ font-weight: 500; color: var(--ink); }
  .progress-item-count{ color: var(--ink-soft); font-family:'IBM Plex Mono', monospace; }
  .progress-bar-track{
    height: 8px;
    border-radius: 999px;
    background: #eee7d8;
    overflow: hidden;
  }
  .progress-bar-fill{
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--dawn), var(--sage));
  }

  /* Intro screen */
  .intro{ text-align:center; padding: 30px 10px; }
  .intro h1{ font-size:38px; }
  .intro .sub{ margin-left:auto; margin-right:auto; }
  .start-btn{
    width:100%;
    justify-content:center;
    font-size:16px;
    padding:16px;
  }

  /* Weight step */
  .weight-row{
    display:flex; gap:10px; align-items:center; margin-bottom:18px;
  }
  .weight-input{
    flex:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:22px;
    padding: 14px 16px;
    border-radius:12px;
    border:1px solid #e4dfd2;
    background:#fffef c;
    background: #fffefc;
    color: var(--ink);
  }
  .weight-input:focus-visible{ outline: 2px solid var(--dawn); outline-offset:1px; }
  .unit-toggle{
    display:flex; border:1px solid #e4dfd2; border-radius:10px; overflow:hidden;
    font-family:'IBM Plex Mono', monospace; font-size:12px;
  }
  .unit-toggle button{
    border:none; background:#fff; padding:10px 12px; cursor:pointer; color: var(--ink-soft);
  }
  .unit-toggle button.active{ background: var(--dawn); color:#fff; }

  .save-msg{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color: var(--sage);
    min-height: 18px;
    margin: -6px 0 14px;
  }

  .spark{
    display:flex; align-items:flex-end; gap:6px; height:56px; margin: 4px 0 24px;
  }
  .spark .bar{
    flex:1;
    background: linear-gradient(180deg, var(--amber), var(--dawn));
    border-radius: 4px 4px 2px 2px;
    min-height:4px;
    position:relative;
  }
  .spark-empty{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color: var(--ink-soft);
    margin: 4px 0 24px;
  }

  /* Completion */
  .complete{ text-align:center; padding: 24px 6px 6px; }
  .stamp{
    width:88px; height:88px;
    margin: 0 auto 20px;
    border: 2.5px solid var(--sage);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color: var(--sage);
    transform: rotate(-8deg);
    animation: stampIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes stampIn{
    0%{ transform: scale(0) rotate(-8deg); opacity:0; }
    100%{ transform: scale(1) rotate(-8deg); opacity:1; }
  }
  .restart{
    background: none;
    border: 1px solid #e4dfd2;
    border-radius: 12px;
    padding: 12px 20px;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    cursor:pointer;
    color: var(--ink-soft);
    margin-top:8px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  @media (max-width:480px){
    .card{ padding: 32px 22px 26px; }
    h1{ font-size:25px; }
    .intro h1{ font-size:30px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="arc-wrap">
    <svg viewBox="0 0 400 92" preserveAspectRatio="xMidYMax meet">
      <path d="M 20 88 A 180 180 0 0 1 380 88" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round"/>
      <circle id="sunDot" class="sun" cx="20" cy="88" r="7" fill="#F4A259"/>
    </svg>
  </div>
  <div class="steplabel" id="stepLabel"></div>
  <div class="card" id="card"></div>
  <div class="outer-actions" id="outerActions"></div>
</div>

<script>
// IndexedDB-backed storage shim: more resilient than localStorage for iOS "Add to Home Screen" apps.
// Falls back to localStorage if IndexedDB is unavailable.
const DB_NAME = 'daily-routine-db';
const STORE_NAME = 'kv';
let dbPromise = null;
function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE_NAME); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function idbGet(key){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbDelete(key){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbKeys(){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAllKeys();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

const hasIDB = typeof indexedDB !== 'undefined';

window.storage = {
  async get(key, shared){
    try{
      if (hasIDB){
        const value = await idbGet(key);
        if (value === undefined) return null;
        return { key, value, shared: !!shared };
      }
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      return { key, value: raw, shared: !!shared };
    }catch(e){ return null; }
  },
  async set(key, value, shared){
    try{
      if (hasIDB){ await idbSet(key, value); }
      else { localStorage.setItem(key, value); }
      return { key, value, shared: !!shared };
    }catch(e){ return null; }
  },
  async delete(key, shared){
    try{
      let existed = false;
      if (hasIDB){
        existed = (await idbGet(key)) !== undefined;
        await idbDelete(key);
      } else {
        existed = localStorage.getItem(key) !== null;
        localStorage.removeItem(key);
      }
      return { key, deleted: existed, shared: !!shared };
    }catch(e){ return null; }
  },
  async list(prefix, shared){
    try{
      let keys;
      if (hasIDB){ keys = await idbKeys(); }
      else {
        keys = [];
        for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
      }
      if (prefix) keys = keys.filter(k => String(k).startsWith(prefix));
      return { keys, prefix, shared: !!shared };
    }catch(e){ return null; }
  }
};

// Best-effort request to protect this site's storage from iOS eviction.
if (navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});

// ---------- storage ----------
async function loadSteps(){
  try{
    const res = await window.storage.get('routine-steps', false);
    if (res && res.value){
      const parsed = JSON.parse(res.value);
      if (Array.isArray(parsed) && parsed.length) return parsed;
    }
  }catch(e){}
  return DEFAULT_STEPS.map(s => ({...s, links: s.links ? s.links.map(l=>({...l})) : undefined}));
}
async function saveSteps(){
  try{ await window.storage.set('routine-steps', JSON.stringify(STEPS), false); }
  catch(e){ console.error('storage error', e); }
}
async function loadSkillNotes(){
  try{
    const res = await window.storage.get('skill-notes', false);
    return res ? JSON.parse(res.value) : {};
  }catch(e){ return {}; }
}
async function saveSkillNotes(){
  try{ await window.storage.set('skill-notes', JSON.stringify(skillNotes), false); }
  catch(e){ console.error('storage error', e); }
}
async function loadCompletions(){
  try{
    const res = await window.storage.get('completions', false);
    if (res) return JSON.parse(res.value);
  }catch(e){}
  return { day: todayKey(), done: {} };
}
async function saveCompletions(){

}

}
const BACKUP_KEYS = ['routine-steps', 'skill-notes', 'completions', 'completion-history', 'weight-entries'];

async function exportBackup(){
  const data = {};
  for (const k of BACKUP_KEYS){
    try{
      const res = await window.storage.get(k, false);
      if (res) data[k] = res.value;
    }catch(e){}
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const stamp = localDateKey(new Date());
  a.download = `daily-routine-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importBackup(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    for (const k of BACKUP_KEYS){
      if (data[k] !== undefined){
        await window.storage.set(k, data[k], false);
      }
    }
    STEPS = await loadSteps();
    skillNotes = await loadSkillNotes();
    completions = await loadCompletions();
    history = await loadHistory();
    view = 'grid';
    render();
  }catch(e){
    alert('Could not read that backup file. Make sure it\'s a JSON file exported from this app.');
  }
}

function todayKey(){
  return localDateKey(new Date());
}
function localDateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function fmtDate(d){
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function ensureToday(){
  const t = todayKey();
  if (completions.day !== t){
    completions = { day: t, done: {} };
  }
}
async function toggleComplete(id){
  ensureToday();
  const nowDone = !completions.done[id];
  completions.done[id] = nowDone;
  await saveCompletions();
  const key = todayKey();
  if (!history[key]) history[key] = {};
  if (nowDone) history[key][id] = true; else delete history[key][id];
  await saveHistory();
  render();
}

// ---------- step management ----------
function slugify(str){
  return 'custom-' + str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,30) + '-' + Date.now().toString(36);
}
async function removeStep(id){
  const idx = STEPS.findIndex(s => s.id === id);
  if (idx === -1) return;
  STEPS.splice(idx, 1);
  delete skillNotes[id];
  delete completions.done[id];
  await saveSteps();
  await saveSkillNotes();
  await saveCompletions();
  removeConfirmStep = null;
  if (activeId === id){ view = 'grid'; activeId = null; }
  render();
}
async function moveStep(id, dir){
  const idx = STEPS.findIndex(s => s.id === id);
  const target = idx + dir;
  if (idx === -1 || target < 0 || target >= STEPS.length) return;
  [STEPS[idx], STEPS[target]] = [STEPS[target], STEPS[idx]];
  await saveSteps();
  render();
}
async function migrateSteps(){
  let changed = false;
  ['english', 'reading', 'bills', 'talk', 'steps', 'stocks'].forEach(id => {
    if (!STEPS.find(s => s.id === id)){
      const def = DEFAULT_STEPS.find(s => s.id === id);
      if (def){ STEPS.push({...def, links: def.links ? def.links.map(l=>({...l})) : []}); changed = true; }
    }
  });
  const renameChecks = [
    { id: 'podcast', oldTitle: 'Something for the commute' },
    { id: 'quran', oldTitle: 'Read a page' },
    { id: 'news', oldTitle: "Today's headlines" },
    { id: 'calendar', oldTitle: "What's on today" }
  ];
  renameChecks.forEach(({ id, oldTitle }) => {
    const idx = STEPS.findIndex(s => s.id === id);
    if (idx !== -1 && STEPS[idx].title === oldTitle){
      const def = DEFAULT_STEPS.find(s => s.id === id);
      STEPS[idx] = {...STEPS[idx], title: def.title, sub: def.sub};
      changed = true;
    }
  });
  if (changed) await saveSteps();
}

// ---------- progress arc ----------
function arcPoint(t){
  const angle = Math.PI - t * Math.PI;
  const cx = 200, cy = 88, r = 180;
  return { x: cx + r*Math.cos(angle), y: cy - r*Math.sin(angle) };
}
function setProgress(){
  ensureToday();
  const total = STEPS.length;
  const done = STEPS.filter(s => completions.done[s.id]).length;
  const t = total ? done / total : 0;
  root.style.setProperty('--t', t.toFixed(3));
  const p = arcPoint(t);
  sunDot.setAttribute('cx', p.x.toFixed(1));
  sunDot.setAttribute('cy', p.y.toFixed(1));
}

// ---------- weight detail ----------
async function renderWeightStep(s){
  const entries = await loadWeights();
  const today = new Date().toDateString();
  const todays = entries.find(e => e.day === today);

  card.innerHTML = `
    ${iconFor(s)}
    <h1>${s.title}</h1>
    <p class="sub">${s.sub}</p>
    <div class="weight-row">
      <input class="weight-input" id="weightInput" type="number" inputmode="decimal" step="0.1" dir="ltr"
        placeholder="e.g. 74.5" value="${todays ? todays.value : ''}">
      <div class="unit-toggle">
        <button data-u="kg" class="${unit==='kg'?'active':''}">kg</button>
        <button data-u="lb" class="${unit==='lb'?'active':''}">lb</button>
      </div>
    </div>
    <div class="save-msg" id="saveMsg">${todays ? "Logged for today ✓" : ""}</div>
    ${entries.length ? '<div class="spark" id="spark"></div>' : '<div class="spark-empty">Your last few entries will show up here once you start logging.</div>'}
    <div class="actions">
      <button class="btn btn-primary" id="saveWeightBtn">Save today's weight <span class="btn-arrow">↵</span></button>
    </div>
  `;

  if (entries.length){
    const last = entries.slice(-7);
    const max = Math.max(...last.map(e=>e.value));
    const min = Math.min(...last.map(e=>e.value));
    const range = Math.max(max - min, 0.5);
    const spark = document.getElementById('spark');
    spark.innerHTML = last.map(e=>{
      const h = 12 + ((e.value - min) / range) * 44;
      return `<div class="bar" style="height:${h}px" title="${fmtDate(new Date(e.day))}: ${e.value}${e.unit}"></div>`;
    }).join('');
  }

  card.querySelectorAll('.unit-toggle button').forEach(b=>{
    b.addEventListener('click', ()=>{ unit = b.dataset.u; render(); });
  });

  document.getElementById('saveWeightBtn').addEventListener('click', async ()=>{
    const val = parseFloat(document.getElementById('weightInput').value);
    const msg = document.getElementById('saveMsg');
    if (!val || val <= 0){ msg.textContent = "Enter a number first"; msg.style.color = '#c0604a'; return; }
    const filtered = entries.filter(e => e.day !== today);
    filtered.push({ day: today, value: val, unit });
    await saveWeights(filtered);
    render();
  });
}

      </div>
    </div>
    <div class="edit-field" style="margin-bottom:10px;">
      <label>Links (optional — add as many as you like)</label>
    </div>
    <div id="linkRowsWrap">${renderLinkRowsHTML(editDraft.links)}</div>
    <button class="edit-link-btn" id="addLinkRowBtn" style="margin-bottom:16px;">+ Add another link</button>
    <div class="actions">
      <button class="btn btn-primary" id="saveWindowBtn">Save changes</button>
      <button class="btn btn-secondary" id="cancelWindowBtn">Cancel</button>
    </div>
    <div class="save-msg" id="windowErrMsg"></div>
  `;

  document.getElementById('addLinkRowBtn').addEventListener('click', ()=>{
    captureEditDraftFromInputs();
    editDraft.links.push({ label:'', url:'' });
    render();
  });
  card.querySelectorAll('.link-remove-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      captureEditDraftFromInputs();
      editDraft.links.splice(parseInt(btn.dataset.idx,10), 1);
      render();
    });
  });
  document.getElementById('saveWindowBtn').addEventListener('click', async ()=>{
    captureEditDraftFromInputs();
    const title = editDraft.title.trim();
    const err = document.getElementById('windowErrMsg');
    if (!title){
      err.style.color = '#c0604a';
      err.textContent = 'A title is needed.';
      return;
    }
    const finalLinks = editDraft.links
      .map((l,i) => ({ label: (l.label||'').trim() || 'Open App', url: (l.url||'').trim(), primary: i===0 }))
      .filter(l => l.url);
    const idx = STEPS.findIndex(x => x.id === s.id);
    if (idx !== -1){
      STEPS[idx] = { ...STEPS[idx], title, sub: editDraft.sub.trim(), links: finalLinks };
      await saveSteps();
    }
    editingWindow = null;
    editDraft = null;
    render();
  });
  document.getElementById('cancelWindowBtn').addEventListener('click', ()=>{
    editingWindow = null;
    editDraft = null;
    render();
  });
}

function renderDetailNav(s){
  const isDone = !!completions.done[s.id];
  const nav = document.createElement('div');
  nav.className = 'nav';
  nav.innerHTML = `
    <button id="backToGridBtn" class="back-main">← Overview</button>
    <button id="completeBtn" class="next-main ${isDone ? 'complete-done' : ''}">${isDone ? 'Completed ✓' : 'Mark complete ✓'}</button>
  `;
  card.appendChild(nav);
  document.getElementById('backToGridBtn').addEventListener('click', ()=>{ view = 'grid'; activeId = null; render(); });
  document.getElementById('completeBtn').addEventListener('click', ()=> toggleComplete(s.id));
}

// ---------- grid (overview) ----------
function renderGrid(){
  ensureToday();
  const doneCount = STEPS.filter(s => completions.done[s.id]).length;
  card.innerHTML = `
    <div class="grid-header">
      <h1>Good morning.</h1>
      <p class="sub">${STEPS.length ? `${doneCount} of ${STEPS.length} done today` : "No windows yet — add the first one below."}</p>
    </div>
    <div class="win-grid">
      ${STEPS.map(s => {
        const isDone = !!completions.done[s.id];
        return `
        <div class="win-card ${isDone ? 'win-done' : ''}" data-id="${s.id}">
          <button class="win-check ${isDone ? 'checked' : ''}" data-id="${s.id}" aria-label="${isDone ? 'Mark incomplete' : 'Mark complete'}">
            ${isDone ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>' : ''}
          </button>
          <div class="win-icon">${iconFor(s)}</div>
          <div class="win-title">${s.title}</div>
        </div>`;
      }).join('')}
    </div>
  `;
  card.querySelectorAll('.win-card').forEach(el=>{
    el.addEventListener('click', ()=>{ view = 'detail'; activeId = el.dataset.id; render(); });
  });
  card.querySelectorAll('.win-check').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); toggleComplete(btn.dataset.id); });
  });
}

// ---------- manage / reorder ----------
function renderManageScreen(){
  card.innerHTML = `
    <h1 style="font-size:26px;">Reorder windows</h1>
    <p class="sub">Move stops up or down, or remove one.</p>
    <div class="manage-list">
      ${STEPS.map((s,i) => `
        <div class="manage-item">
          <div class="manage-item-title">${i+1}. ${s.title}</div>
          <div class="manage-item-actions">
            <button class="manage-arrow" data-dir="-1" data-id="${s.id}" ${i===0?'disabled':''} aria-label="Move up">↑</button>
            <button class="manage-arrow" data-dir="1" data-id="${s.id}" ${i===STEPS.length-1?'disabled':''} aria-label="Move down">↓</button>
            <button class="manage-remove" data-id="${s.id}" aria-label="Remove ${s.title}">✕</button>
          </div>
        </div>
      `).join('') || '<p class="skill-note-empty">No windows yet.</p>'}
    </div>
  `;
  card.querySelectorAll('.manage-arrow').forEach(b=>{
    b.addEventListener('click', ()=> moveStep(b.dataset.id, parseInt(b.dataset.dir, 10)));
  });
  card.querySelectorAll('.manage-remove').forEach(b=>{
    b.addEventListener('click', ()=> removeStep(b.dataset.id));
  });
}
function renderManageNav(){
  const nav = document.createElement('div');
  nav.className = 'nav';
  nav.innerHTML = `
    <button class="back-main" disabled>← Back</button>
    <button id="doneManageBtn" class="next-main">Done →</button>
  `;
  card.appendChild(nav);
  document.getElementById('doneManageBtn').addEventListener('click', ()=>{ view = 'grid'; render(); });
}

// ---------- add window form ----------
function captureAddDraftFromInputs(){
  if (!addDraft) return;
  const titleInput = document.getElementById('newTitleInput');
  const subInput = document.getElementById('newSubInput');
  if (titleInput) addDraft.title = titleInput.value;
  if (subInput) addDraft.sub = subInput.value;
  const rows = card.querySelectorAll('.link-edit-row');
  const links = [];
  rows.forEach(row=>{
    const label = row.querySelector('[data-k="label"]').value;
    const url = row.querySelector('[data-k="url"]').value;
    links.push({ label, url });
  });
  addDraft.links = links;
}
function renderAddForm(){
  if (!addDraft) addDraft = { title:'', sub:'', links:[{label:'', url:''}] };
  card.innerHTML = `
    <h1 style="font-size:26px;">Add a window</h1>
    <div class="edit-fields">
      <div class="edit-field">
        <label>Title</label>
        <input type="text" class="edit-input" dir="auto" id="newTitleInput" placeholder="e.g. LinkedIn" value="${addDraft.title.replace(/"/g,'&quot;')}">
      </div>
      <div class="edit-field">
        <label>Short description (optional)</label>
        <input type="text" class="edit-input" dir="auto" id="newSubInput" placeholder="e.g. Check messages and notifications" value="${addDraft.sub.replace(/"/g,'&quot;')}">
      </div>
    </div>
    <div class="edit-field" style="margin-bottom:10px;">
      <label>Links (optional — add as many as you like)</label>
    </div>
    <div id="linkRowsWrap">${renderLinkRowsHTML(addDraft.links)}</div>
    <button class="edit-link-btn" id="addLinkRowBtn" style="margin-bottom:16px;">+ Add another link</button>
    <div class="actions">
      <button class="btn btn-primary" id="confirmAddBtn">Add window</button>
      <button class="btn btn-secondary" id="cancelAddBtn">Cancel</button>
    </div>
    <div class="save-msg" id="addErrMsg"></div>
  `;
  document.getElementById('addLinkRowBtn').addEventListener('click', ()=>{
    captureAddDraftFromInputs();
    addDraft.links.push({ label:'', url:'' });
    render();
  });
  card.querySelectorAll('.link-remove-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      captureAddDraftFromInputs();
      addDraft.links.splice(parseInt(btn.dataset.idx,10), 1);
      render();
    });
  });
  document.getElementById('confirmAddBtn').addEventListener('click', async ()=>{
    captureAddDraftFromInputs();
    const title = addDraft.title.trim();
    const err = document.getElementById('addErrMsg');
    if (!title){
      err.style.color = '#c0604a';
      err.textContent = 'A title is needed.';
      return;
    }
    const finalLinks = addDraft.links
      .map((l,i) => ({ label: (l.label||'').trim() || 'Open App', url: (l.url||'').trim(), primary: i===0 }))
      .filter(l => l.url);
    const newStep = { id: slugify(title), iconKey: 'custom', title, sub: addDraft.sub.trim(), links: finalLinks };
    STEPS.push(newStep);
    await saveSteps();
    addDraft = null;
    view = 'grid';
    render();
  });
  document.getElementById('cancelAddBtn').addEventListener('click', ()=>{
    addDraft = null;
    view = 'grid';
    render();
  });
}

// ---------- progress page ----------
function computeStats(days){
  const keys = [];
  const base = new Date();
  for (let i = 0; i < days; i++){
    const d = new Date(base);
    d.setDate(d.getDate() - i);
    keys.push(localDateKey(d));
  }
  return STEPS.map(s => {
    const count = keys.filter(k => history[k] && history[k][s.id]).length;
    return { id: s.id, title: s.title, count, total: days };
  });
}
function renderProgress(){
  const days = progressPeriod === 'week' ? 7 : progressPeriod === 'month' ? 30 : 365;
  const stats = computeStats(days);
  card.innerHTML = `
    ${ICONS.chart}
    <h1 style="font-size:26px;">Progress</h1>
    <p class="sub">How consistently you're hitting each window.</p>
    <div class="period-tabs">
      <button class="period-tab ${progressPeriod==='week'?'active':''}" data-p="week">Week</button>
      <button class="period-tab ${progressPeriod==='month'?'active':''}" data-p="month">Month</button>
      <button class="period-tab ${progressPeriod==='year'?'active':''}" data-p="year">Year</button>
    </div>
    <div class="progress-list">
      ${stats.map(st => {
        const pct = st.total ? Math.round((st.count/st.total)*100) : 0;
        return `
        <div class="progress-item">
          <div class="progress-item-top">
            <span class="progress-item-title">${st.title}</span>
            <span class="progress-item-count">${st.count}/${st.total}</span>
          </div>
          <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        </div>`;
      }).join('') || '<p class="skill-note-empty">No windows yet.</p>'}
    </div>
  `;
  card.querySelectorAll('.period-tab').forEach(b=>{
    b.addEventListener('click', ()=>{ progressPeriod = b.dataset.p; render(); });
  });
}
function renderProgressNav(){
  const nav = document.createElement('div');
  nav.className = 'nav';
  nav.innerHTML = `
    <button class="back-main" disabled>← Back</button>
    <button id="doneProgressBtn" class="next-main">Done →</button>
  `;
  card.appendChild(nav);
  document.getElementById('doneProgressBtn').addEventListener('click', ()=>{ view = 'grid'; render(); });
}

// ---------- outer toolbar ----------
function renderOuterActions(){
  outerActions.innerHTML = '';

  if (view === 'grid'){
    outerActions.innerHTML = `
      <button class="outer-btn" id="addWindowOuterBtn">+ Add a window</button>
      <button class="outer-btn" id="reorderOuterBtn">⇅ Reorder windows</button>
      <button class="outer-btn" id="progressOuterBtn">📈 Progress</button>
      <button class="outer-btn" id="backupOuterBtn">⬇ Backup</button>
      <button class="outer-btn" id="restoreOuterBtn">⬆ Restore</button>
      <input type="file" id="restoreFileInput" accept="application/json" style="display:none">
    `;
    document.getElementById('addWindowOuterBtn').addEventListener('click', ()=>{ addDraft = null; view = 'add'; render(); });
    document.getElementById('reorderOuterBtn').addEventListener('click', ()=>{ view = 'manage'; render(); });
    document.getElementById('progressOuterBtn').addEventListener('click', ()=>{ view = 'progress'; render(); });
    document.getElementById('backupOuterBtn').addEventListener('click', exportBackup);
    document.getElementById('restoreOuterBtn').addEventListener('click', ()=>{
      document.getElementById('restoreFileInput').click();
    });
    document.getElementById('restoreFileInput').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if (file) await importBackup(file);
    });
    return;
  }

  if (view !== 'detail') return;
  const s = STEPS.find(x => x.id === activeId);
  if (!s || editingWindow === s.id) return;

  if (removeConfirmStep === s.id){
    outerActions.innerHTML = `
      <div class="outer-confirm">
        <span>Remove this window?</span>
        <button class="outer-btn danger" id="confirmRemoveBtn">Yes, remove</button>
        <button class="outer-btn" id="cancelRemoveBtn">Cancel</button>
      </div>
    `;
    document.getElementById('confirmRemoveBtn').addEventListener('click', ()=> removeStep(s.id));
    document.getElementById('cancelRemoveBtn').addEventListener('click', ()=>{ removeConfirmStep = null; render(); });
    return;
  }

  outerActions.innerHTML = `
    <button class="outer-btn" id="editWindowOuterBtn">✎ Edit title, description & links</button>
    <button class="outer-btn danger" id="removeWindowOuterBtn">✕ Remove this window</button>
  `;
  document.getElementById('editWindowOuterBtn').addEventListener('click', ()=>{
    editingWindow = s.id;
    editDraft = { title: s.title, sub: s.sub || '', links: (s.links || []).map(l => ({...l})) };
    render();
  });
  document.getElementById('removeWindowOuterBtn').addEventListener('click', ()=>{ removeConfirmStep = s.id; render(); });
}

// ---------- master render ----------
async function render(){
  ensureToday();
  setProgress();

  if (view === 'manage'){
    stepLabel.textContent = 'Reorder & manage';
    renderManageScreen();
    renderManageNav();
    outerActions.innerHTML = '';
    return;
  }

  if (view === 'progress'){
    stepLabel.textContent = 'Progress';
    renderProgress();
    renderProgressNav();
    outerActions.innerHTML = '';
    return;
  }

  if (view === 'add'){
    stepLabel.textContent = 'Add a window';
    renderAddForm();
    outerActions.innerHTML = '';
    return;
  }

  if (view === 'detail'){
    const s = STEPS.find(x => x.id === activeId);
    if (!s){ view = 'grid'; activeId = null; return render(); }
    stepLabel.textContent = s.title;
    if (editingWindow === s.id){
      renderWindowEditor(s);
      outerActions.innerHTML = '';
      return;
    }
    if (s.type === 'weight'){
      await renderWeightStep(s);
    } else {
      renderLinkStep(s);
    }
    renderSkillNote(s);
    renderDetailNav(s);
    renderOuterActions();
    return;
  }

  // grid view (default / home)
  stepLabel.textContent = '';
  renderGrid();
  renderOuterActions();
}

(async function init(){
  STEPS = await loadSteps();
  await migrateSteps();
  skillNotes = await loadSkillNotes();
  completions = await loadCompletions();
  history = await loadHistory();
  let notesChanged = false;
  STEPS.forEach(s => {
    if (!skillNotes[s.id] && DEFAULT_NOTES[s.id]){
      skillNotes[s.id] = DEFAULT_NOTES[s.id];
      notesChanged = true;
    }
  });
  if (notesChanged) await saveSkillNotes();
  render();
})();
</script>
