function wireTodoScreen(){
  const addBtn = document.getElementById('addTodoBtn');
  if (addBtn) addBtn.addEventListener('click', async ()=>{
    const input = document.getElementById('todoTextInput');
    const text = input.value.trim();
    if (!text) return;
    await addTodo(text, todoSelectedColor, activeTodoListId);
  });
  card.querySelectorAll('.todo-check').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleTodoDone(btn.dataset.id));
  });
  setupTodoDragReorder();
  card.querySelectorAll('.todo-delete').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteTodo(btn.dataset.id));
  });
  card.querySelectorAll('.todo-to-today').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); moveTodoToToday(btn.dataset.id); });
  });
}
function renderTodoNav(){

    <button class="back-main" disabled>← Back</button>
    <button id="doneTodoBtn" class="next-main">Done →</button>

    view = 'grid';
    activeTodoListId = null;
    editingTodoListTitle = null;
    removeConfirmTodoList = null;
    render();
  });
}
function renderAddTodoListForm(){

    <p class="sub">Give it a name — e.g. "Work," "Home," "Errands."</p>

// ---------- outer toolbar ----------
let optionsExpanded = false;
try { optionsExpanded = localStorage.getItem('optionsExpanded') === '1'; } catch(e){}
function toggleOptions(){
  optionsExpanded = !optionsExpanded;
  try { localStorage.setItem('optionsExpanded', optionsExpanded ? '1' : '0'); } catch(e){}
  renderOuterActions();
}
function renderOuterActions(){
  outerActions.innerHTML = '';

  if (view === 'grid' && calSelectedKey && calSelectedKey !== todayKey()){ return; }
  if (view === 'grid'){
    const toggleHTML = `
      <button class="outer-toggle" id="optionsToggleBtn" aria-expanded="${optionsExpanded}">
        <span>${optionsExpanded ? 'Hide options' : 'Options'}</span><span>${optionsExpanded ? '&uarr;' : '&darr;'}</span>
      </button>`;
    if (!optionsExpanded){
      outerActions.innerHTML = toggleHTML;
      document.getElementById('optionsToggleBtn').addEventListener('click', toggleOptions);
      return;
    }
    outerActions.innerHTML = toggleHTML + `
      <button class="outer-btn" id="addWindowOuterBtn">+ Add a skill</button>
      <button class="outer-btn" id="addTodoListOuterBtn">+ Add a to-do-list</button>
      <button class="outer-btn" id="reorderOuterBtn">⇅ Reorder windows</button>
      <button class="outer-btn" id="progressOuterBtn">📈 Progress</button>
      <button class="outer-btn" id="backupOuterBtn">⬇ Backup</button>
      <button class="outer-btn" id="restoreOuterBtn">⬆ Restore</button>
      <input type="file" id="restoreFileInput" accept="application/json" style="display:none">
    `;
    document.getElementById('optionsToggleBtn').addEventListener('click', toggleOptions);
    document.getElementById('addWindowOuterBtn').addEventListener('click', ()=>{ addDraft = null; view = 'add'; render(); });
    document.getElementById('addTodoListOuterBtn').addEventListener('click', ()=>{ view = 'addTodoList'; render(); });
    document.getElementById('reorderOuterBtn').addEventListener('click', ()=>{ view = 'manage'; render(); });
    document.getElementById('progressOuterBtn').addEventListener('click', ()=>{ view = 'progress'; render(); });
    document.getElementById('backupOuterBtn').addEventListener('click', exportBackup);
    document.getElementById('restoreOuterBtn').addEventListener('click', ()=>{
      document.getElementById('restoreFileInput').click();
    });
    document.getElementById('restoreFileInput').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if (file) await importBackup(file);
    });
    return;
  }

  if (view === 'todo'){
    const list = todoLists.find(l => l.id === activeTodoListId);
    if (!list || editingTodoListTitle === list.id) return;
    if (removeConfirmTodoList === list.id){
      outerActions.innerHTML = `
        <div class="outer-confirm">
          <span>Remove this to-do-list and its tasks?</span>
          <button class="outer-btn danger" id="confirmRemoveTodoListBtn">Yes, remove</button>
          <button class="outer-btn" id="cancelRemoveTodoListBtn">Cancel</button>
        </div>
      `;
      document.getElementById('confirmRemoveTodoListBtn').addEventListener('click', ()=> removeTodoList(list.id));
      document.getElementById('cancelRemoveTodoListBtn').addEventListener('click', ()=>{ removeConfirmTodoList = null; render(); });
      return;
    }
    outerActions.innerHTML = `
      <button class="outer-btn" id="editTodoListTitleBtn">✎ Edit list title & color</button>
      <button class="outer-btn danger" id="removeTodoListBtn">✕ Remove this list</button>
    `;
    document.getElementById('editTodoListTitleBtn').addEventListener('click', ()=>{ editingTodoListTitle = list.id; todoListColorDraft = listColorOf(list); render(); });
    document.getElementById('removeTodoListBtn').addEventListener('click', ()=>{ removeConfirmTodoList = list.id; render(); });
    return;
  }

  if (view !== 'detail') return;
  const s = STEPS.find(x => x.id === activeId);
  if (!s || editingWindow === s.id) return;

  if (removeConfirmStep === s.id){
    outerActions.innerHTML = `
      <div class="outer-confirm">
        <span>Remove this window?</span>
        <button class="outer-btn danger" id="confirmRemoveBtn">Yes, remove</button>
        <button class="outer-btn" id="cancelRemoveBtn">Cancel</button>
      </div>
    `;
    document.getElementById('confirmRemoveBtn').addEventListener('click', ()=> removeStep(s.id));
    document.getElementById('cancelRemoveBtn').addEventListener('click', ()=>{ removeConfirmStep = null; render(); });
    return;
  }

  outerActions.innerHTML = `
    <button class="outer-btn" id="editWindowOuterBtn">✎ Edit title, description & links</button>
    <button class="outer-btn danger" id="removeWindowOuterBtn">✕ Remove this window</button>
  `;
  document.getElementById('editWindowOuterBtn').addEventListener('click', ()=>{
    editingWindow = s.id;
    editDraft = {
      title: s.title, sub: s.sub || '',
      links: (s.links || []).map(l => ({...l, days: scheduleToDays(l.schedule)})),
      days: scheduleToDays(s.schedule),
      note: skillNotes[s.id] || ''
    };
    render();
  });
  document.getElementById('removeWindowOuterBtn').addEventListener('click', ()=>{ removeConfirmStep = s.id; render(); });
}

// ---------- master render ----------
async function render(){
  ensureToday();
  setProgress();

  if (view === 'manage'){
    stepLabel.textContent = 'Reorder & manage';
    renderManageScreen();
    renderManageNav();
    outerActions.innerHTML = '';
    return;
  }

  if (view === 'progress'){
    stepLabel.textContent = 'Progress';
    renderProgress();
    renderProgressNav();
    outerActions.innerHTML = '';
    return;
  }

  if (view === 'todo'){
    const list = todoLists.find(l => l.id === activeTodoListId);
    if (!list){ view = 'grid'; activeTodoListId = null; return render(); }
    stepLabel.textContent = list.title;
    renderTodoScreen();
    renderTodoNav();
    renderOuterActions();
    return;
  }

  if (view === 'addTodoList'){
    stepLabel.textContent = 'Add a to-do-list';
    renderAddTodoListForm();
    outerActions.innerHTML = '';
    return;
  }

  if (view === 'add'){
    stepLabel.textContent = 'Add a skill';
    renderAddForm();
    outerActions.innerHTML = '';
    return;
  }

  if (view === 'detail'){
    const s = STEPS.find(x => x.id === activeId);
    if (!s){ view = 'grid'; activeId = null; return render(); }
    stepLabel.textContent = s.title;
    if (editingWindow === s.id){
      renderWindowEditor(s);
      renderWindowEditorNav();
      outerActions.innerHTML = '';
      return;
    }
    if (s.type === 'weight'){
      await renderWeightStep(s);
    } else {
      renderLinkStep(s);
    }
    renderSkillNote(s);
    renderDetailNav(s);
    renderOuterActions();
    return;
  }

  // grid view (default / home)
  stepLabel.textContent = '';
  renderGrid();
  renderOuterActions();
}

async function seedIfFresh(){
  try{
    const hasSteps = await window.storage.get('routine-steps', false);
    const hasLists = await window.storage.get('todo-lists', false);
    if (hasSteps || hasLists) return;
    for (const k of Object.keys(SEED_BACKUP)){
      await window.storage.set(k, SEED_BACKUP[k], false);
    }
  }catch(e){ console.error('seed error', e); }
}
(async function init(){
  await seedIfFresh();
  STEPS = await loadSteps();
  await migrateSteps();
  skillNotes = await loadSkillNotes();
  completions = await loadCompletions();
  history = await loadHistory();
  linkHistory = await loadLinkHistory();
  todos = await loadTodos();
  const loadedLists = await loadTodoLists();
  if (loadedLists){
    todoLists = loadedLists;
    // legacy todos saved before multi-list support won't have a listId — attach them to the first list
    let needsSave = false;
    todos.forEach(t => {
      if (!t.listId){ t.listId = todoLists[0].id; needsSave = true; }
    });
    if (needsSave) await saveTodos();
  } else {
    todoLists = [{ id: 'todo-list-default', title: 'To-Do List' }];
    todos = todos.map(t => t.listId ? t : { ...t, listId: 'todo-list-default' });
    await saveTodoLists();
    if (todos.length) await saveTodos();
  }
  let notesChanged = false;
  STEPS.forEach(s => {
    if (!skillNotes[s.id] && DEFAULT_NOTES[s.id]){
      skillNotes[s.id] = DEFAULT_NOTES[s.id];
      notesChanged = true;
    }
  });
  if (notesChanged) await saveSkillNotes();
  doneLog = await loadDoneLog();
  todoCleanupDate = await loadTodoCleanupDate();
  await cleanupCompletedTodosIfNewDay();
  render();
  // catch the midnight rollover if the app is left open — check every minute
  setInterval(async ()=>{
    const changed = await cleanupCompletedTodosIfNewDay();
    if (changed) render();
  }, 60 * 1000);
})();
</script>
